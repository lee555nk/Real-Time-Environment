<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>环境与位置仪表盘</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e2640;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --accent-yellow: #facc15;
      --accent-rose: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 40px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 18px 0;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .card.full-width { grid-column: span 2; }
    .title {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
    }
    .value-address {
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 600;
      color: #f1f5f9;
      min-height: 2.4rem;
    }
    .unit {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 4px;
    }
    .sub-info {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 6px;
    }
    button {
      margin-top: 22px;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }
    button.active {
      background: var(--accent);
      color: #0b0f19;
    }
    button:active { opacity: 0.8; }
    .status {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>实时位置与环境仪表盘</h1>

  <div class="grid">
    <!-- 详细中文地址 -->
    <div class="card full-width">
      <div class="title">当前所在详细中文地址</div>
      <div class="value-address" id="address">正在自动定位中...</div>
      <div class="sub-info" id="addr-source">数据源：多通道高精逆地理编码解析</div>
    </div>

    <!-- 经纬度坐标与精度 -->
    <div class="card full-width">
      <div class="title">经纬度坐标</div>
      <div class="value" id="coords">-- , --</div>
      <div class="sub-info" id="accuracy">定位精度: --</div>
    </div>

    <!-- 日出时间 -->
    <div class="card">
      <div class="title">今日日出</div>
      <div class="value" style="color: var(--accent-yellow);"><span id="sunrise">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 日落时间 -->
    <div class="card">
      <div class="title">今日日落</div>
      <div class="value" style="color: var(--accent-rose);"><span id="sunset">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 海拔高度 -->
    <div class="card">
      <div class="title">GPS 海拔高度</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
      <div class="sub-info">卫星定位高程</div>
    </div>

    <!-- 相对湿度 -->
    <div class="card">
      <div class="title">相对湿度</div>
      <div class="value" style="color: var(--accent-green);"><span id="humidity">--</span><span class="unit">%</span></div>
      <div class="sub-info">室外空气含湿量</div>
    </div>

    <!-- 室外温度 -->
    <div class="card">
      <div class="title">室外气温</div>
      <div class="value" style="color: var(--accent-orange);"><span id="temperature">--</span><span class="unit">°C</span></div>
      <div class="sub-info">气象站监测</div>
    </div>

    <!-- 地表气压 -->
    <div class="card">
      <div class="title">地表气压</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
      <div class="sub-info">实时气象估算</div>
    </div>
  </div>

  <button id="actionBtn" onclick="handleBtnClick()">暂停监测</button>
  <div class="status" id="statusText">正在自动启动实时监测...</div>

  <script>
    let watchId = null;
    let isTracking = false;
    let lastWeatherTime = 0;
    let lastAddressTime = 0;
    let lastLat = null;
    let lastLon = null;

    // 1. 火星坐标系 (GCJ-02) 纠偏转换
    function wgs84ToGcj02(wgsLat, wgsLon) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      if (outOfChina(wgsLat, wgsLon)) return { lat: wgsLat, lon: wgsLon };
      
      let dLat = transformLat(wgsLon - 105.0, wgsLat - 35.0);
      let dLon = transformLon(wgsLon - 105.0, wgsLat - 35.0);
      const radLat = (wgsLat / 180.0) * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return { lat: wgsLat + dLat, lon: wgsLon + dLon };
    }

    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }

    function transformLon(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
      return ret;
    }

    function outOfChina(lat, lon) {
      return (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271);
    }

    // 2. 按钮控制
    function handleBtnClick() {
      if (isTracking) {
        stopTracking();
      } else {
        startTrackingProcess();
      }
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isTracking = false;
      const btn = document.getElementById('actionBtn');
      btn.innerText = '开启监测';
      btn.classList.add('active');
      document.getElementById('statusText').innerText = '实时监测已手动暂停';
    }

    // 3. 核心定位启动
    function startTrackingProcess() {
      const btn = document.getElementById('actionBtn');
      const status = document.getElementById('statusText');

      if (!('geolocation' in navigator)) {
        status.innerText = '错误：当前环境不支持 Geolocation 定位';
        return;
      }

      status.innerText = '正在调起高精度卫星定位...';
      btn.innerText = '暂停监测';
      btn.classList.remove('active');

      let hasAcquiredFirstPoint = false;

      // 3.5秒超时自动降级探针（针对室内弱网）
      const fallbackTimer = setTimeout(() => {
        if (!hasAcquiredFirstPoint) {
          status.innerText = '卫星搜星较弱，已自动切换基站/Wi-Fi定位...';
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              if (!hasAcquiredFirstPoint) {
                hasAcquiredFirstPoint = true;
                onLocationSuccess(pos);
                startContinuousWatch();
              }
            },
            (err) => {
              if (!hasAcquiredFirstPoint) handleLocationError(err);
            },
            { enableHighAccuracy: false, timeout: 5000, maximumAge: 30000 }
          );
        }
      }, 3500);

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          clearTimeout(fallbackTimer);
          if (!hasAcquiredFirstPoint) {
            hasAcquiredFirstPoint = true;
            onLocationSuccess(pos);
            startContinuousWatch();
          }
        },
        (err) => {
          if (err.code === 3 && !hasAcquiredFirstPoint) {
            clearTimeout(fallbackTimer);
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                if (!hasAcquiredFirstPoint) {
                  hasAcquiredFirstPoint = true;
                  onLocationSuccess(pos);
                  startContinuousWatch();
                }
              },
              handleLocationError,
              { enableHighAccuracy: false, timeout: 5000, maximumAge: 30000 }
            );
          } else if (!hasAcquiredFirstPoint) {
            clearTimeout(fallbackTimer);
            handleLocationError(err);
          }
        },
        { enableHighAccuracy: true, timeout: 3500, maximumAge: 0 }
      );
    }

    function startContinuousWatch() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(
        onLocationSuccess,
        (err) => console.warn('监听波动:', err),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 2000 }
      );
    }

    function onLocationSuccess(pos) {
      isTracking = true;
      const btn = document.getElementById('actionBtn');
      btn.innerText = '暂停监测';
      btn.classList.remove('active');

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const alt = pos.coords.altitude;
      const acc = pos.coords.accuracy;

      document.getElementById('coords').innerText = `${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
      document.getElementById('accuracy').innerText = `定位精度: 误差 ±${Math.round(acc)} 米`;

      if (alt !== null && !isNaN(alt)) {
        document.getElementById('altitude').innerText = alt.toFixed(1);
      } else {
        document.getElementById('altitude').innerText = '弱信号';
      }

      document.getElementById('statusText').innerText = `最后刷新: ${new Date().toLocaleTimeString()}`;

      const now = Date.now();
      if (now - lastWeatherTime > 45000) {
        fetchWeatherData(lat, lon);
        lastWeatherTime = now;
      }

      if (now - lastAddressTime > 45000 || !lastLat || calcDistance(lastLat, lastLon, lat, lon) > 40) {
        fetchAddress(lat, lon);
        lastAddressTime = now;
        lastLat = lat;
        lastLon = lon;
      }
    }

    function handleLocationError(err) {
      const status = document.getElementById('statusText');
      const btn = document.getElementById('actionBtn');
      btn.innerText = '点击重新授权';
      btn.classList.add('active');
      isTracking = false;

      switch (err.code) {
        case 1:
          status.innerHTML = '<span style="color:#ef4444">定位被拒：请去 iPhone【设置 > 隐私与安全性 > 定位服务】中允许 Safari 或网页访问位置</span>';
          break;
        case 2:
          status.innerText = '无法获取位置：GPS 及基站均无信号';
          break;
        case 3:
          status.innerText = '定位超时：室内信号弱，请移步室外或窗边';
          break;
        default:
          status.innerText = `定位异常 (${err.message || '未知错误'})`;
      }
    }

    // 4. 国内直连高精中文地址
    function fetchAddress(lat, lon) {
      const addressEl = document.getElementById('address');
      const gcj = wgs84ToGcj02(lat, lon);
      const callbackName = 'geo_cb_' + Math.floor(Math.random() * 1000000);
      let isResolved = false;

      const timeoutId = setTimeout(() => {
        if (!isResolved) {
          isResolved = true;
          delete window[callbackName];
          fallbackAddressChannel(lat, lon);
        }
      }, 4000);

      window[callbackName] = function(data) {
        if (isResolved) return;
        isResolved = true;
        clearTimeout(timeoutId);

        try {
          if (data && data.status === '1' && data.regeocode) {
            const re = data.regeocode;
            const comp = re.addressComponent || {};
            const segs = [];

            if (comp.country && typeof comp.country === 'string') segs.push(comp.country);
            const prov = comp.province;
            if (prov && typeof prov === 'string') segs.push(prov);
            const city = comp.city;
            if (city && typeof city === 'string' && city !== prov && !segs.includes(city)) segs.push(city);
            const dist = comp.district;
            if (dist && typeof dist === 'string' && !segs.includes(dist)) segs.push(dist);

            let roadStr = '';
            if (comp.township && typeof comp.township === 'string') roadStr = comp.township;
            if (comp.streetNumber && comp.streetNumber.street) {
              roadStr = comp.streetNumber.street + (comp.streetNumber.number || '');
            }
            if (roadStr && !segs.includes(roadStr)) segs.push(roadStr);

            let poiName = '';
            if (re.pois && re.pois.length > 0) {
              poiName = re.pois[0].name;
            } else if (re.aois && re.aois.length > 0) {
              poiName = re.aois[0].name;
            }
            if (poiName && !segs.includes(poiName)) segs.push(poiName);

            addressEl.innerText = segs.length >= 2 ? segs.join('，') : (re.formatted_address || '解析成功');
            document.getElementById('addr-source').innerText = '数据源：高精地图直连解析 (国内极速)';
          } else {
            fallbackAddressChannel(lat, lon);
          }
        } catch (e) {
          fallbackAddressChannel(lat, lon);
        } finally {
          delete window[callbackName];
          const el = document.getElementById(callbackName);
          if (el) el.remove();
        }
      };

      const script = document.createElement('script');
      script.id = callbackName;
      script.src = `https://restapi.amap.com/v3/geocode/regeo?key=c22144703a8fc4b4d662aa0c46b5a2bf&location=${gcj.lon.toFixed(6)},${gcj.lat.toFixed(6)}&extensions=all&output=json&callback=${callbackName}`;
      document.head.appendChild(script);
    }

    async function fallbackAddressChannel(lat, lon) {
      const addressEl = document.getElementById('address');
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      try {
        const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();

        if (data) {
          const segs = [];
          if (data.countryName) segs.push(data.countryName);
          if (data.principalSubdivision) segs.push(data.principalSubdivision);
          if (data.city && !segs.includes(data.city)) segs.push(data.city);
          if (data.locality && !segs.includes(data.locality)) segs.push(data.locality);

          addressEl.innerText = segs.length > 0 ? segs.join('，') : '地址解析完成';
          document.getElementById('addr-source').innerText = '数据源：全球 Anycast 镜像直连';
        }
      } catch (err) {
        addressEl.innerText = '已定位，详细街道稍后刷新';
      }
    }

    // 5. 气象与日出日落
    async function fetchWeatherData(lat, lon) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure&daily=sunrise,sunset&timezone=auto`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();

        if (data && data.current) {
          document.getElementById('temperature').innerText = data.current.temperature_2m;
          document.getElementById('humidity').innerText = data.current.relative_humidity_2m;
          document.getElementById('pressure').innerText = data.current.surface_pressure;
        }

        if (data && data.daily && data.daily.sunrise) {
          document.getElementById('sunrise').innerText = data.daily.sunrise[0].split('T')[1];
          document.getElementById('sunset').innerText = data.daily.sunset[0].split('T')[1];
        }
      } catch (err) {
        console.warn('气象请求超时');
      }
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 🚀 核心修改：页面只要完成加载，直接自动调用启动，不再等待任何权限查询或手动点击
    window.addEventListener('DOMContentLoaded', () => {
      startTrackingProcess();
    });
  </script>
</body>
</html>
