<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>环境与位置仪表盘</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e2640;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --accent-yellow: #facc15;
      --accent-rose: #f43f5e;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px 40px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 18px 0;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .card.full-width {
      grid-column: span 2;
    }
    .title {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
    }
    .value-address {
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 600;
      color: #f1f5f9;
      min-height: 2.4rem;
    }
    .unit {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 4px;
    }
    .sub-info {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 6px;
    }
    button {
      margin-top: 22px;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }
    button.active {
      background: var(--accent);
      color: #0b0f19;
    }
    button:active {
      opacity: 0.8;
    }
    .status {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>实时位置与环境仪表盘</h1>

  <div class="grid">
    <!-- 详细中文地址 -->
    <div class="card full-width">
      <div class="title">当前所在详细中文地址</div>
      <div class="value-address" id="address">正在自动定位中...</div>
      <div class="sub-info" id="addr-source">数据源：高精度逆地理编码解析</div>
    </div>

    <!-- 经纬度坐标与精度 -->
    <div class="card full-width">
      <div class="title">经纬度坐标</div>
      <div class="value" id="coords">-- , --</div>
      <div class="sub-info" id="accuracy">定位精度: --</div>
    </div>

    <!-- 日出时间 -->
    <div class="card">
      <div class="title">今日日出</div>
      <div class="value" style="color: var(--accent-yellow);"><span id="sunrise">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 日落时间 -->
    <div class="card">
      <div class="title">今日日落</div>
      <div class="value" style="color: var(--accent-rose);"><span id="sunset">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 海拔高度 -->
    <div class="card">
      <div class="title">GPS 海拔高度</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
      <div class="sub-info">卫星定位高程</div>
    </div>

    <!-- 相对湿度 -->
    <div class="card">
      <div class="title">相对湿度</div>
      <div class="value" style="color: var(--accent-green);"><span id="humidity">--</span><span class="unit">%</span></div>
      <div class="sub-info">室外空气含湿量</div>
    </div>

    <!-- 室外温度 -->
    <div class="card">
      <div class="title">室外气温</div>
      <div class="value" style="color: var(--accent-orange);"><span id="temperature">--</span><span class="unit">°C</span></div>
      <div class="sub-info">气象站监测</div>
    </div>

    <!-- 地表气压 -->
    <div class="card">
      <div class="title">地表气压</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
      <div class="sub-info">实时气象估算</div>
    </div>
  </div>

  <button id="toggleBtn" onclick="toggleTracking()">暂停监测</button>
  <div class="status" id="statusText">正在自动启动实时监测...</div>

  <script>
    let watchId = null;
    let lastWeatherTime = 0;
    let lastAddressTime = 0;
    let lastLat = null;
    let lastLon = null;

    function startTracking() {
      const btn = document.getElementById('toggleBtn');
      const status = document.getElementById('statusText');

      if (!('geolocation' in navigator)) {
        status.innerText = '当前浏览器不支持位置服务';
        return;
      }

      status.innerText = '正在搜寻高精度卫星信号...';
      btn.innerText = '暂停监测';
      btn.classList.remove('active');

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const alt = pos.coords.altitude;
          const acc = pos.coords.accuracy;

          // 更新坐标与精度
          document.getElementById('coords').innerText = `${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
          document.getElementById('accuracy').innerText = `定位精度: 误差 ±${Math.round(acc)} 米`;

          // 更新海拔
          if (alt !== null) {
            document.getElementById('altitude').innerText = alt.toFixed(1);
          } else {
            document.getElementById('altitude').innerText = '弱信号';
          }

          status.innerText = `最后刷新: ${new Date().toLocaleTimeString()}`;

          // 定时获取天气及日出日落（每 60 秒）
          const now = Date.now();
          if (now - lastWeatherTime > 60000) {
            fetchWeatherData(lat, lon);
            lastWeatherTime = now;
          }

          // 移动超 50 米或超 60 秒时更新中文地址
          if (now - lastAddressTime > 60000 || !lastLat || calcDistance(lastLat, lastLon, lat, lon) > 50) {
            fetchDetailedChineseAddress(lat, lon);
            lastAddressTime = now;
            lastLat = lat;
            lastLon = lon;
          }
        },
        (err) => {
          let errorMsg = '定位失败';
          switch (err.code) {
            case err.PERMISSION_DENIED:
              errorMsg = '定位失败：请在 iPhone 设置中允许 Safari 获取“使用位置”权限';
              break;
            case err.POSITION_UNAVAILABLE:
              errorMsg = '定位失败：位置信息不可用';
              break;
            case err.TIMEOUT:
              errorMsg = '定位失败：获取超时，请到开阔处重试';
              break;
          }
          status.innerText = errorMsg;
          btn.innerText = '开启监测';
          btn.classList.add('active');
          watchId = null;
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    function stopTracking() {
      const btn = document.getElementById('toggleBtn');
      const status = document.getElementById('statusText');
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      btn.innerText = '开启监测';
      btn.classList.add('active');
      status.innerText = '监测已暂停';
    }

    function toggleTracking() {
      if (watchId !== null) {
        stopTracking();
      } else {
        startTracking();
      }
    }

    // 获取温湿度、地表气压、日出日落时间
    async function fetchWeatherData(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure&daily=sunrise,sunset&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.current) {
          document.getElementById('temperature').innerText = data.current.temperature_2m;
          document.getElementById('humidity').innerText = data.current.relative_humidity_2m;
          document.getElementById('pressure').innerText = data.current.surface_pressure;
        }

        if (data && data.daily && data.daily.sunrise && data.daily.sunset) {
          const sunriseStr = data.daily.sunrise[0];
          const sunsetStr = data.daily.sunset[0];
          if (sunriseStr && sunsetStr) {
            document.getElementById('sunrise').innerText = sunriseStr.split('T')[1] || sunriseStr;
            document.getElementById('sunset').innerText = sunsetStr.split('T')[1] || sunsetStr;
          }
        }
      } catch (err) {
        console.error('获取气象数据失败:', err);
      }
    }

    // 细化解析中文地址
    async function fetchDetailedChineseAddress(lat, lon) {
      const addressEl = document.getElementById('address');
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&addressdetails=1&accept-language=zh-CN`;
        const res = await fetch(url, {
          headers: { 'Accept-Language': 'zh-CN,zh;q=0.9' }
        });
        const data = await res.json();
        
        if (data && data.address) {
          const a = data.address;
          const segments = [];

          if (a.country) segments.push(a.country);

          const province = a.province || a.state || (a.city && (a.city.endsWith('市') || a.city.includes('北京') || a.city.includes('上海') || a.city.includes('天津') || a.city.includes('重庆')) ? a.city : '');
          if (province && !segments.includes(province)) segments.push(province);

          if (a.city && !segments.includes(a.city)) {
            segments.push(a.city);
          }

          const district = a.city_district || a.district || a.suburb || a.county || '';
          if (district && !segments.includes(district)) {
            segments.push(district);
          }

          let roadInfo = '';
          const road = a.road || a.street || a.neighbourhood || '';
          const houseNumber = a.house_number ? `${a.house_number}号` : '';
          if (road) {
            roadInfo = houseNumber ? `${road}${houseNumber}` : road;
          } else if (houseNumber) {
            roadInfo = houseNumber;
          }
          if (roadInfo) segments.push(roadInfo);

          const poi = a.stadium || a.sports_centre || a.building || a.amenity || a.tourism || a.leisure || a.shop || data.name || '';
          if (poi && !segments.includes(poi) && !roadInfo.includes(poi)) {
            segments.push(poi);
          }

          if (segments.length >= 2) {
            addressEl.innerText = segments.join('，');
          } else {
            addressEl.innerText = data.display_name;
          }
        } else if (data && data.display_name) {
          addressEl.innerText = data.display_name;
        }
      } catch (err) {
        addressEl.innerText = '获取详细地址超时，请检查网络连接';
        console.error('逆地理编码请求失败:', err);
      }
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // 🚀 核心修改：页面加载完毕后立即自动开启定位与数据获取
    window.addEventListener('DOMContentLoaded', () => {
      startTracking();
    });
  </script>
</body>
</html>
