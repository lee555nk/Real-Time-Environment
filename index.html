<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>环境与位置仪表盘</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e2640;
      --card-sub-bg: #141b2d;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 20px 0;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .card.full-width {
      grid-column: span 2;
    }
    .title {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
    }
    .value-address {
      font-size: 1.05rem;
      line-height: 1.5;
      font-weight: 600;
      color: #e2e8f0;
      min-height: 2.2rem;
    }
    .unit {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 4px;
    }
    .sub-info {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 6px;
    }
    button {
      margin-top: 24px;
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.8;
    }
    .status {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>实时位置与环境仪表盘</h1>

  <div class="grid">
    <!-- 具体中文地址 -->
    <div class="card full-width">
      <div class="title">当前所在中文位置</div>
      <div class="value-address" id="address">正在获取位置授权...</div>
    </div>

    <!-- 经纬度坐标与精度 -->
    <div class="card full-width">
      <div class="title">经纬度坐标</div>
      <div class="value" id="coords">-- , --</div>
      <div class="sub-info" id="accuracy">定位精度: --</div>
    </div>

    <!-- 海拔高度 -->
    <div class="card">
      <div class="title">GPS 海拔高度</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
      <div class="sub-info">卫星定位高程</div>
    </div>

    <!-- 相对湿度 -->
    <div class="card">
      <div class="title">相对湿度</div>
      <div class="value" style="color: var(--accent-green);"><span id="humidity">--</span><span class="unit">%</span></div>
      <div class="sub-info">室外空气含湿量</div>
    </div>

    <!-- 室外温度 -->
    <div class="card">
      <div class="title">室外气温</div>
      <div class="value" style="color: var(--accent-orange);"><span id="temperature">--</span><span class="unit">°C</span></div>
      <div class="sub-info">气象站监测</div>
    </div>

    <!-- 估计地表大气压 -->
    <div class="card">
      <div class="title">地表气压</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
      <div class="sub-info">实时气象估算</div>
    </div>
  </div>

  <button id="toggleBtn" onclick="toggleTracking()">开启实时监测</button>
  <div class="status" id="statusText">首次打开请点击按钮并允许浏览器定位权限</div>

  <script>
    let watchId = null;
    let lastWeatherTime = 0;
    let lastAddressTime = 0;
    let lastLat = null;
    let lastLon = null;

    function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      const status = document.getElementById('statusText');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.innerText = '开启实时监测';
        status.innerText = '监测已暂停';
        return;
      }

      if (!('geolocation' in navigator)) {
        status.innerText = '当前浏览器不支持位置服务';
        return;
      }

      status.innerText = '正在搜寻高精度卫星信号...';
      btn.innerText = '停止监测';

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const alt = pos.coords.altitude;
          const acc = pos.coords.accuracy;

          // 更新经纬度与定位精度
          document.getElementById('coords').innerText = `${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
          document.getElementById('accuracy').innerText = `定位精度: 误差 ±${Math.round(acc)} 米`;

          // 更新海拔高度
          if (alt !== null) {
            document.getElementById('altitude').innerText = alt.toFixed(1);
          } else {
            document.getElementById('altitude').innerText = '弱信号';
          }

          status.innerText = `最后刷新: ${new Date().toLocaleTimeString()}`;

          // 定时/按需获取气象信息（每 30 秒更新一次，避免请求频次超限）
          const now = Date.now();
          if (now - lastWeatherTime > 30000) {
            fetchWeatherData(lat, lon);
            lastWeatherTime = now;
          }

          // 位置发生明显变化或超过 60 秒时，重新反查中文街道地址
          if (now - lastAddressTime > 60000 || !lastLat || calcDistance(lastLat, lastLon, lat, lon) > 100) {
            fetchAddressChinese(lat, lon);
            lastAddressTime = now;
            lastLat = lat;
            lastLon = lon;
          }
        },
        (err) => {
          let errorMsg = '定位失败';
          switch (err.code) {
            case err.PERMISSION_DENIED:
              errorMsg = '定位失败：请在 iPhone 设置中允许 Safari 获取“使用位置”权限';
              break;
            case err.POSITION_UNAVAILABLE:
              errorMsg = '定位失败：位置信息不可用';
              break;
            case err.TIMEOUT:
              errorMsg = '定位失败：获取超时，请到开阔地带重试';
              break;
          }
          status.innerText = errorMsg;
          btn.innerText = '开启实时监测';
          watchId = null;
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    // 免费获取环境数据：温度、湿度、地表气压
    async function fetchWeatherData(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.current) {
          document.getElementById('temperature').innerText = data.current.temperature_2m;
          document.getElementById('humidity').innerText = data.current.relative_humidity_2m;
          document.getElementById('pressure').innerText = data.current.surface_pressure;
        }
      } catch (err) {
        console.error('获取气象数据异常:', err);
      }
    }

    // 免费获取当前具体中文地址（逆地理编码）
    async function fetchAddressChinese(lat, lon) {
      const addressEl = document.getElementById('address');
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=zh-CN`;
        const res = await fetch(url, {
          headers: { 'Accept-Language': 'zh-CN,zh;q=0.9' }
        });
        const data = await res.json();
        if (data && data.display_name) {
          // 精简显示街道、区县与城市，避免文字过长堆叠
          const addr = data.address;
          if (addr) {
            const city = addr.city || addr.town || addr.county || '';
            const district = addr.suburb || addr.city_district || '';
            const road = addr.road || addr.neighbourhood || '';
            const amenity = addr.building || addr.amenity || '';
            const formatted = [city, district, road, amenity].filter(Boolean).join(' · ');
            addressEl.innerText = formatted || data.display_name;
          } else {
            addressEl.innerText = data.display_name;
          }
        }
      } catch (err) {
        addressEl.innerText = '获取详细地址失败，请检查网络连接';
        console.error('逆地理编码请求异常:', err);
      }
    }

    // 辅助函数：简易计算两点经纬度距离（米）
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }
  </script>
</body>
</html>
