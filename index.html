<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>环境与位置仪表盘</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card.full-width {
      grid-column: span 2;
    }
    .title {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }
    .unit {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 4px;
    }
    button {
      margin-top: 24px;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <h1>实时环境仪表盘</h1>

  <div class="grid">
    <div class="card full-width">
      <div class="title">当前坐标</div>
      <div class="value" id="coords">-- , --</div>
    </div>
    <div class="card">
      <div class="title">GPS 海拔高度</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
    </div>
    <div class="card">
      <div class="title">室外气温 (气象站)</div>
      <div class="value"><span id="temperature">--</span><span class="unit">°C</span></div>
    </div>
    <div class="card full-width">
      <div class="title">地表气压 (气象站估算)</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
    </div>
  </div>

  <button id="toggleBtn" onclick="toggleTracking()">开启实时监测</button>
  <div class="status" id="statusText">等待授权定位权限...</div>

  <script>
    let watchId = null;
    let lastWeatherFetch = 0;

    function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      const status = document.getElementById('statusText');

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btn.innerText = '开启实时监测';
        status.innerText = '监测已暂停';
        return;
      }

      if (!('geolocation' in navigator)) {
        status.innerText = '当前浏览器不支持地理定位';
        return;
      }

      status.innerText = '正在获取高精度位置...';
      btn.innerText = '停止监测';

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const alt = pos.coords.altitude;

          document.getElementById('coords').innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
          document.getElementById('altitude').innerText = alt !== null ? alt.toFixed(1) : '无信号';
          status.innerText = `最后刷新: ${new Date().toLocaleTimeString()}`;

          // 控制气象 API 刷新频率（每 30 秒最多请求一次）
          const now = Date.now();
          if (now - lastWeatherFetch > 30000) {
            fetchWeather(lat, lon);
            lastWeatherFetch = now;
          }
        },
        (err) => {
          status.innerText = `定位失败: ${err.message}`;
          btn.innerText = '开启实时监测';
          watchId = null;
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    async function fetchWeather(lat, lon) {
      try {
        // 使用免费免 Key 的 Open-Meteo API 获取当前气温与地表气压
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,surface_pressure`);
        const data = await res.json();
        if (data && data.current) {
          document.getElementById('temperature').innerText = data.current.temperature_2m;
          document.getElementById('pressure').innerText = data.current.surface_pressure;
        }
      } catch (e) {
        console.error('获取气象数据失败', e);
      }
    }
  </script>
</body>
</html>
