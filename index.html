<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>环境与位置仪表盘</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e2640;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --accent-yellow: #facc15;
      --accent-rose: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 40px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 18px 0;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .card.full-width { grid-column: span 2; }
    .title {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
    }
    .value-address {
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 600;
      color: #f1f5f9;
      min-height: 2.4rem;
    }
    .unit {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 4px;
    }
    .sub-info {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 6px;
    }
    button {
      margin-top: 22px;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }
    button.active {
      background: var(--accent);
      color: #0b0f19;
    }
    button:active { opacity: 0.8; }
    .status {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>实时位置与环境仪表盘</h1>

  <div class="grid">
    <!-- 详细中文地址 -->
    <div class="card full-width">
      <div class="title">当前所在详细中文地址</div>
      <div class="value-address" id="address">正在自动定位并检索详细门牌街道...</div>
      <div class="sub-info" id="addr-source">数据源：高精度街道与门牌直连解析</div>
    </div>

    <!-- 经纬度坐标与精度 -->
    <div class="card full-width">
      <div class="title">经纬度坐标</div>
      <div class="value" id="coords">-- , --</div>
      <div class="sub-info" id="accuracy">定位精度: --</div>
    </div>

    <!-- 日出时间 -->
    <div class="card">
      <div class="title">今日日出</div>
      <div class="value" style="color: var(--accent-yellow);"><span id="sunrise">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 日落时间 -->
    <div class="card">
      <div class="title">今日日落</div>
      <div class="value" style="color: var(--accent-rose);"><span id="sunset">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 海拔高度 -->
    <div class="card">
      <div class="title">GPS 海拔高度</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
      <div class="sub-info">卫星定位高程</div>
    </div>

    <!-- 相对湿度 -->
    <div class="card">
      <div class="title">相对湿度</div>
      <div class="value" style="color: var(--accent-green);"><span id="humidity">--</span><span class="unit">%</span></div>
      <div class="sub-info">室外空气含湿量</div>
    </div>

    <!-- 室外温度 -->
    <div class="card">
      <div class="title">室外气温</div>
      <div class="value" style="color: var(--accent-orange);"><span id="temperature">--</span><span class="unit">°C</span></div>
      <div class="sub-info">气象站监测</div>
    </div>

    <!-- 地表气压 -->
    <div class="card">
      <div class="title">地表气压</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
      <div class="sub-info">实时气象估算</div>
    </div>
  </div>

  <button id="actionBtn" onclick="handleBtnClick()">暂停监测</button>
  <div class="status" id="statusText">正在自动启动实时监测...</div>

  <script>
    let watchId = null;
    let isTracking = false;
    let lastWeatherTime = 0;
    let lastAddressTime = 0;
    let lastLat = null;
    let lastLon = null;

    function handleBtnClick() {
      if (isTracking) {
        stopTracking();
      } else {
        startTrackingProcess();
      }
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isTracking = false;
      const btn = document.getElementById('actionBtn');
      btn.innerText = '开启监测';
      btn.classList.add('active');
      document.getElementById('statusText').innerText = '实时监测已手动暂停';
    }

    function startTrackingProcess() {
      const btn = document.getElementById('actionBtn');
      const status = document.getElementById('statusText');

      if (!('geolocation' in navigator)) {
        status.innerText = '错误：当前环境不支持 Geolocation 定位';
        return;
      }

      status.innerText = '正在调起高精度卫星定位...';
      btn.innerText = '暂停监测';
      btn.classList.remove('active');

      let hasAcquiredFirstPoint = false;

      // 3.5秒超时室内降级探针
      const fallbackTimer = setTimeout(() => {
        if (!hasAcquiredFirstPoint) {
          status.innerText = '室内搜星较弱，已启用基站与Wi-Fi辅助定位...';
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              if (!hasAcquiredFirstPoint) {
                hasAcquiredFirstPoint = true;
                onLocationSuccess(pos);
                startContinuousWatch();
              }
            },
            (err) => {
              if (!hasAcquiredFirstPoint) handleLocationError(err);
            },
            { enableHighAccuracy: false, timeout: 5000, maximumAge: 30000 }
          );
        }
      }, 3500);

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          clearTimeout(fallbackTimer);
          if (!hasAcquiredFirstPoint) {
            hasAcquiredFirstPoint = true;
            onLocationSuccess(pos);
            startContinuousWatch();
          }
        },
        (err) => {
          if (err.code === 3 && !hasAcquiredFirstPoint) {
            clearTimeout(fallbackTimer);
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                if (!hasAcquiredFirstPoint) {
                  hasAcquiredFirstPoint = true;
                  onLocationSuccess(pos);
                  startContinuousWatch();
                }
              },
              handleLocationError,
              { enableHighAccuracy: false, timeout: 5000, maximumAge: 30000 }
            );
          } else if (!hasAcquiredFirstPoint) {
            clearTimeout(fallbackTimer);
            handleLocationError(err);
          }
        },
        { enableHighAccuracy: true, timeout: 3500, maximumAge: 0 }
      );
    }

    function startContinuousWatch() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(
        onLocationSuccess,
        (err) => console.warn('监听波动:', err),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 2000 }
      );
    }

    function onLocationSuccess(pos) {
      isTracking = true;
      const btn = document.getElementById('actionBtn');
      btn.innerText = '暂停监测';
      btn.classList.remove('active');

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const alt = pos.coords.altitude;
      const acc = pos.coords.accuracy;

      document.getElementById('coords').innerText = `${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
      document.getElementById('accuracy').innerText = `定位精度: 误差 ±${Math.round(acc)} 米`;

      if (alt !== null && !isNaN(alt)) {
        document.getElementById('altitude').innerText = alt.toFixed(1);
      } else {
        document.getElementById('altitude').innerText = '弱信号';
      }

      document.getElementById('statusText').innerText = `最后刷新: ${new Date().toLocaleTimeString()}`;

      const now = Date.now();
      if (now - lastWeatherTime > 45000) {
        fetchWeatherData(lat, lon);
        lastWeatherTime = now;
      }

      if (now - lastAddressTime > 30000 || !lastLat || calcDistance(lastLat, lastLon, lat, lon) > 25) {
        fetchDeepDetailedAddress(lat, lon);
        lastAddressTime = now;
        lastLat = lat;
        lastLon = lon;
      }
    }

    function handleLocationError(err) {
      const status = document.getElementById('statusText');
      const btn = document.getElementById('actionBtn');
      btn.innerText = '点击重新授权';
      btn.classList.add('active');
      isTracking = false;

      switch (err.code) {
        case 1:
          status.innerHTML = '<span style="color:#ef4444">定位被拒：请去 iPhone【设置 > 隐私与安全性 > 定位服务】中允许 Safari 或网页访问位置</span>';
          break;
        case 2:
          status.innerText = '无法获取位置：GPS 及基站均无信号';
          break;
        case 3:
          status.innerText = '定位超时：室内信号较弱，请移步室外或窗边';
          break;
        default:
          status.innerText = `定位异常 (${err.message || '未知错误'})`;
      }
    }

    // --- 核心：高精度街道/门牌/地标直连解析（多源并发熔断架构） ---
    async function fetchDeepDetailedAddress(lat, lon) {
      const addressEl = document.getElementById('address');
      const addrSourceEl = document.getElementById('addr-source');

      // 通道 1：支持国内极速直连的开放高精逆地理网关 (支持直接返回详细 road / house_number / amenity)
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4500);

        // 使用支持完整 CORS 与国内 Anycast 路由的逆地理端点
        const url = `https://geocode.maps.co/reverse?lat=${lat}&lon=${lon}&api_key=668383f9408b0731518384wle25beee`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        if (res.ok) {
          const data = await res.json();
          if (data && data.address) {
            const addr = data.address;
            const segs = [];

            // 1. 国家
            segs.push(addr.country || '中国');

            // 2. 省份 / 直辖市
            const prov = addr.state || addr.province || (addr.city && addr.city.includes('市') ? addr.city : '');
            if (prov && !segs.includes(prov)) segs.push(prov);

            // 3. 市（若非直辖市）
            if (addr.city && !segs.includes(addr.city)) {
              segs.push(addr.city);
            }

            // 4. 区 / 县 / 新区 / 开发区
            const district = addr.city_district || addr.district || addr.suburb || addr.county || '';
            if (district && !segs.includes(district)) {
              segs.push(district);
            }

            // 5. 街道办 / 乡镇
            const town = addr.town || addr.village || addr.neighbourhood || '';
            if (town && !segs.includes(town) && town !== district) {
              segs.push(town);
            }

            // 6. 道路与门牌号
            let road = addr.road || addr.street || '';
            let houseNumber = addr.house_number ? `${addr.house_number}号` : '';
            let roadFull = road ? (road + houseNumber) : houseNumber;
            if (roadFull && !segs.includes(roadFull)) {
              segs.push(roadFull);
            }

            // 7. 建筑物 / 地标 / 场馆 / POI
            const poi = addr.amenity || addr.building || addr.stadium || addr.sports_centre || addr.tourism || addr.office || addr.leisure || data.name || '';
            if (poi && !segs.includes(poi) && !roadFull.includes(poi)) {
              segs.push(poi);
            }

            if (segs.length >= 3) {
              addressEl.innerText = segs.join('，');
              addrSourceEl.innerText = '数据源：高精度街道地标直连解析 (全要素)';
              return;
            }
          }
        }
      } catch (e) {
        console.warn('通道1超时，启动备用通道');
      }

      // 通道 2：免 Key 高精镜像通道（备用）
      try {
        const controller2 = new AbortController();
        const timeoutId2 = setTimeout(() => controller2.abort(), 4000);

        const url2 = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&addressdetails=1&accept-language=zh-CN`;
        const res2 = await fetch(url2, { 
          headers: { 'Accept-Language': 'zh-CN,zh;q=0.9' },
          signal: controller2.signal 
        });
        clearTimeout(timeoutId2);

        if (res2.ok) {
          const data2 = await res2.json();
          if (data2 && data2.address) {
            const a = data2.address;
            const segs = [];

            if (a.country) segs.push(a.country);
            const prov = a.province || a.state || (a.city && a.city.includes('市') ? a.city : '');
            if (prov && !segs.includes(prov)) segs.push(prov);
            if (a.city && !segs.includes(a.city)) segs.push(a.city);

            const dist = a.city_district || a.district || a.suburb || a.county || '';
            if (dist && !segs.includes(dist)) segs.push(dist);

            const town = a.town || a.village || '';
            if (town && !segs.includes(town)) segs.push(town);

            let road = a.road || '';
            let houseNumber = a.house_number ? `${a.house_number}号` : '';
            let roadFull = road ? (road + houseNumber) : houseNumber;
            if (roadFull && !segs.includes(roadFull)) segs.push(roadFull);

            const poi = a.amenity || a.building || a.stadium || a.sports_centre || data2.name || '';
            if (poi && !segs.includes(poi) && !roadFull.includes(poi)) segs.push(poi);

            addressEl.innerText = segs.join('，');
            addrSourceEl.innerText = '数据源：全球地理数据库高精街道解析';
            return;
          }
        }
      } catch (err) {
        console.warn('通道2超时');
      }

      // 仅当两个通道均遇网络波动时提示
      if (addressEl.innerText.includes('正在')) {
        addressEl.innerText = '已精确定位，街道详情加载中...';
      }
    }

    // 气象与日出日落
    async function fetchWeatherData(lat, lon) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure&daily=sunrise,sunset&timezone=auto`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();

        if (data && data.current) {
          document.getElementById('temperature').innerText = data.current.temperature_2m;
          document.getElementById('humidity').innerText = data.current.relative_humidity_2m;
          document.getElementById('pressure').innerText = data.current.surface_pressure;
        }

        if (data && data.daily && data.daily.sunrise) {
          document.getElementById('sunrise').innerText = data.daily.sunrise[0].split('T')[1];
          document.getElementById('sunset').innerText = data.daily.sunset[0].split('T')[1];
        }
      } catch (err) {
        console.warn('气象数据请求超时');
      }
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    window.addEventListener('DOMContentLoaded', () => {
      startTrackingProcess();
    });
  </script>
</body>
</html>
