<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <title>环境与位置仪表盘</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e2640;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --accent-yellow: #facc15;
      --accent-rose: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 40px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 18px 0;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .card.full-width { grid-column: span 2; }
    .title {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
    }
    .value-address {
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 600;
      color: #f1f5f9;
      min-height: 2.4rem;
    }
    .unit {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 4px;
    }
    .sub-info {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 6px;
    }
    button {
      margin-top: 22px;
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }
    button.active {
      background: var(--accent);
      color: #0b0f19;
    }
    button:active { opacity: 0.8; }
    .status {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
      max-width: 90%;
      line-height: 1.4;
    }
  </style>
  <script type="text/javascript">
    window._AMapSecurityConfig = { securityJsCode: '900b3e58b8f804dc4043b2f883da4e4f' };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=3d02f5a8c9038234ea7e6d088924bce6&plugin=AMap.Geocoder"></script>
</head>
<body>

  <h1>实时位置与环境仪表盘</h1>

  <div class="grid">
    <!-- 详细中文地址 -->
    <div class="card full-width">
      <div class="title">当前所在街道及道路</div>
      <div class="value-address" id="address">正在获取道路信息...</div>
      <div class="sub-info" id="addr-source">数据源：高德官方引擎道路级解析</div>
    </div>

    <!-- 经纬度坐标与精度 -->
    <div class="card full-width">
      <div class="title">经纬度坐标</div>
      <div class="value" id="coords">-- , --</div>
      <div class="sub-info" id="accuracy">定位精度: --</div>
    </div>

    <!-- 日出时间 -->
    <div class="card">
      <div class="title">今日日出</div>
      <div class="value" style="color: var(--accent-yellow);"><span id="sunrise">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 日落时间 -->
    <div class="card">
      <div class="title">今日日落</div>
      <div class="value" style="color: var(--accent-rose);"><span id="sunset">--:--</span></div>
      <div class="sub-info">当地天文时间</div>
    </div>

    <!-- 海拔高度 -->
    <div class="card">
      <div class="title">GPS 海拔高度</div>
      <div class="value"><span id="altitude">--</span><span class="unit">m</span></div>
      <div class="sub-info">卫星定位高程</div>
    </div>

    <!-- 相对湿度 -->
    <div class="card">
      <div class="title">相对湿度</div>
      <div class="value" style="color: var(--accent-green);"><span id="humidity">--</span><span class="unit">%</span></div>
      <div class="sub-info">室外空气含湿量</div>
    </div>

    <!-- 室外温度 -->
    <div class="card">
      <div class="title">室外气温</div>
      <div class="value" style="color: var(--accent-orange);"><span id="temperature">--</span><span class="unit">°C</span></div>
      <div class="sub-info">气象站监测</div>
    </div>

    <!-- 地表气压 -->
    <div class="card">
      <div class="title">地表气压</div>
      <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
      <div class="sub-info">实时气象估算</div>
    </div>
  </div>

  <button id="actionBtn" onclick="handleBtnClick()">开启定位</button>
  <div class="status" id="statusText" aria-live="polite">点击按钮开启定位并授权访问位置</div>

  <script>
    let watchId = null;
    let isTracking = false;
    let isStarting = false;
    let geocoder = null;
    let lastWeatherTime = 0;
    let lastAddressTime = 0;
    let lastLat = null;
    let lastLon = null;
    let trackingSession = 0;

    const AUTO_START_KEY = 'live-environment-auto-start';

    function hasAutoStartPreference() {
      try {
        return localStorage.getItem(AUTO_START_KEY) === '1';
      } catch (error) {
        return false;
      }
    }

    function rememberAutoStartPreference() {
      try {
        localStorage.setItem(AUTO_START_KEY, '1');
      } catch (error) {
        // Private browsing may disable localStorage; the current session still works.
      }
    }

    const statusEl = document.getElementById('statusText');
    const actionBtn = document.getElementById('actionBtn');
    const addressEl = document.getElementById('address');
    const addrSourceEl = document.getElementById('addr-source');
    const coordsEl = document.getElementById('coords');
    const accuracyEl = document.getElementById('accuracy');
    const altitudeEl = document.getElementById('altitude');

    function setStatus(message, isError = false) {
      statusEl.innerText = message;
      statusEl.style.color = isError ? '#fca5a5' : 'var(--text-sub)';
    }

    function updateButton(state) {
      actionBtn.classList.remove('active');
      actionBtn.disabled = false;

      if (state === 'idle') {
        actionBtn.innerText = '开启定位';
        actionBtn.classList.add('active');
      } else if (state === 'busy') {
        actionBtn.innerText = '定位中...';
        actionBtn.disabled = true;
      } else if (state === 'active') {
        actionBtn.innerText = '暂停监测';
      } else if (state === 'retry') {
        actionBtn.innerText = '重试定位';
        actionBtn.classList.add('active');
      }
    }

    function wgs84ToGcj02(wgsLat, wgsLon) {
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      if (outOfChina(wgsLat, wgsLon)) return { lat: wgsLat, lon: wgsLon };

      let dLat = transformLat(wgsLon - 105.0, wgsLat - 35.0);
      let dLon = transformLon(wgsLon - 105.0, wgsLat - 35.0);
      const radLat = (wgsLat / 180.0) * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return { lat: wgsLat + dLat, lon: wgsLon + dLon };
    }

    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }

    function transformLon(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
      return ret;
    }

    function outOfChina(lat, lon) {
      return (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271);
    }

    function getCurrentPosition(options) {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
      });
    }

    async function getBestPosition(session) {
      setStatus('正在请求位置权限...');

      try {
        return await getCurrentPosition({
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0
        });
      } catch (highAccuracyError) {
        if (highAccuracyError.code === 1) throw highAccuracyError;
        if (session !== trackingSession) throw new Error('tracking-cancelled');

        setStatus('高精度定位超时，正在切换快速定位...');
        await new Promise(resolve => setTimeout(resolve, 300));

        return getCurrentPosition({
          enableHighAccuracy: false,
          timeout: 15000,
          maximumAge: 300000
        });
      }
    }

    async function prepareTracking() {
      if (!window.isSecureContext) {
        setStatus('当前页面不是安全连接，浏览器不会提供定位权限。请使用 HTTPS 页面。', true);
        updateButton('retry');
        return;
      }

      if (!('geolocation' in navigator)) {
        setStatus('当前浏览器不支持定位功能。', true);
        updateButton('retry');
        return;
      }

      let permissionState = 'prompt';
      try {
        const permission = await navigator.permissions.query({ name: 'geolocation' });
        permissionState = permission.state;
        permission.addEventListener?.('change', () => {
          if (permission.state === 'granted' && !isTracking && !isStarting) {
            startTrackingProcess();
          }
        });
      } catch (error) {
        // Safari may not expose the Geolocation permission state; the button still works.
      }

      const autoStartRequested = hasAutoStartPreference();

      if (permissionState === 'granted' || (permissionState !== 'denied' && autoStartRequested)) {
        setStatus('正在自动恢复上次定位...');
        startTrackingProcess();
      } else if (permissionState === 'denied') {
        setStatus('定位权限已被拒绝，请在浏览器网站设置中重新允许位置访问，然后点击“重试定位”。', true);
        updateButton('retry');
      } else {
        setStatus('点击“开启定位”，并在浏览器提示中允许访问位置。');
        updateButton('idle');
      }
    }

    function handleBtnClick() {
      if (isTracking || isStarting) {
        stopTracking();
      } else {
        startTrackingProcess();
      }
    }

    function stopTracking() {
      trackingSession += 1;
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isTracking = false;
      isStarting = false;
      updateButton('idle');
      setStatus('实时监测已暂停。');
    }

    async function startTrackingProcess() {
      if (isTracking || isStarting) return;

      const session = ++trackingSession;
      isStarting = true;
      updateButton('busy');

      try {
        const position = await getBestPosition(session);
        if (session !== trackingSession) return;

        isStarting = false;
        isTracking = true;
        onLocationSuccess(position);
        startContinuousWatch(session);
      } catch (error) {
        if (session !== trackingSession || error.message === 'tracking-cancelled') return;
        isStarting = false;
        handleLocationError(error);
      }
    }

    function startContinuousWatch(session) {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);

      watchId = navigator.geolocation.watchPosition(
        position => {
          if (session === trackingSession) onLocationSuccess(position);
        },
        error => {
          if (session !== trackingSession) return;
          if (error.code === 1) {
            isTracking = false;
            handleLocationError(error);
          } else {
            setStatus('位置信号暂时中断，页面保留最后位置并继续重试。');
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 5000
        }
      );
    }

    function onLocationSuccess(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const altitude = position.coords.altitude;
      const accuracy = position.coords.accuracy;

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        isTracking = false;
        isStarting = false;
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        setStatus('浏览器返回了无效坐标，请点击“重试定位”。', true);
        updateButton('retry');
        return;
      }

      isTracking = true;
      isStarting = false;
      rememberAutoStartPreference();
      updateButton('active');

      coordsEl.innerText = `${lat.toFixed(5)}°, ${lon.toFixed(5)}°`;
      accuracyEl.innerText = Number.isFinite(accuracy)
        ? `定位精度: 误差 ±${Math.round(accuracy)} 米`
        : '定位精度: 浏览器未提供';

      if (Number.isFinite(altitude)) {
        altitudeEl.innerText = altitude.toFixed(1);
      } else {
        altitudeEl.innerText = '弱信号';
      }

      setStatus(`定位成功，最后刷新：${new Date().toLocaleTimeString('zh-CN', { hour12: false })}`);

      const now = Date.now();
      if (now - lastWeatherTime > 45000) {
        fetchWeatherData(lat, lon);
      }

      if (
        now - lastAddressTime > 30000 ||
        lastLat === null ||
        lastLon === null ||
        calcDistance(lastLat, lastLon, lat, lon) > 25
      ) {
        resolveRoadAddress(lat, lon);
      }

      lastLat = lat;
      lastLon = lon;
    }

    function handleLocationError(error) {
      if (!error || error.message === 'tracking-cancelled') return;

      const message = {
        1: '定位被拒：请允许此网站访问位置；iPhone 可在【设置 > 隐私与安全性 > 定位服务】中检查 Safari 网站权限。',
        2: '无法获取位置：请确认系统定位服务已开启，并到窗边或室外后重试。',
        3: '定位超时：请确认定位服务已开启，并点击“重试定位”。'
      }[error.code] || `定位异常：${error.message || '未知错误'}`;

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isTracking = false;
      isStarting = false;
      updateButton('retry');
      setStatus(message, true);
    }

    function getAmapGeocoder() {
      if (geocoder) return geocoder;
      if (typeof AMap !== 'undefined' && AMap.Geocoder) {
        geocoder = new AMap.Geocoder({
          extensions: 'all',
          radius: 1000
        });
      }
      return geocoder;
    }

    function resolveRoadAddress(lat, lon) {
      lastAddressTime = Date.now();
      addressEl.innerText = '正在解析街道地址...';
      addrSourceEl.innerText = '数据源：正在尝试高德地图';

      const amapGeocoder = getAmapGeocoder();
      if (!amapGeocoder) {
        resolveWithPhoton(lat, lon);
        return;
      }

      const gcj = wgs84ToGcj02(lat, lon);
      let settled = false;
      const fallbackTimer = setTimeout(() => {
        if (settled) return;
        settled = true;
        resolveWithPhoton(lat, lon);
      }, 5000);

      amapGeocoder.getAddress([gcj.lon, gcj.lat], (status, result) => {
        if (settled) return;
        settled = true;
        clearTimeout(fallbackTimer);

        if (status === 'complete' && result && result.regeocode) {
          renderAmapAddress(result.regeocode);
        } else {
          resolveWithPhoton(lat, lon);
        }
      });
    }

    function containsChinese(value) {
      return /[\u3400-\u9fff]/.test(String(value || ''));
    }

    function renderAmapAddress(regeocode) {
      const component = regeocode.addressComponent || {};
      const segments = [];
      const pushUnique = value => {
        if (value && !segments.includes(value)) segments.push(value);
      };

      pushUnique(component.country);
      pushUnique(component.province);
      pushUnique(component.city && component.city !== component.province ? component.city : '');
      pushUnique(component.district);
      pushUnique(component.township);

      let road = '';
      if (component.streetNumber && component.streetNumber.street) {
        road = component.streetNumber.street + (component.streetNumber.number || '');
      } else if (regeocode.roads && regeocode.roads.length > 0) {
        road = regeocode.roads[0].name;
      } else if (regeocode.crossroads && regeocode.crossroads.length > 0) {
        road = `${regeocode.crossroads[0].first_name}与${regeocode.crossroads[0].second_name}交叉口`;
      }
      pushUnique(road);

      addressEl.innerText = segments.length >= 2
        ? segments.join('，')
        : (regeocode.formattedAddress || '已获取坐标，未解析到道路名称');
      addrSourceEl.innerText = '数据源：高德地图道路级解析';
    }

    async function resolveWithPhoton(lat, lon) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 7000);

      try {
        const url = new URL('https://photon.komoot.io/reverse');
        url.searchParams.set('lat', lat.toFixed(7));
        url.searchParams.set('lon', lon.toFixed(7));

        const response = await fetch(url, {
          signal: controller.signal,
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error(`Photon ${response.status}`);

        const data = await response.json();
        const properties = data && data.features && data.features[0] && data.features[0].properties;
        const formatted = formatPhotonAddress(properties);
        if (!formatted) throw new Error('empty address');

        addressEl.innerText = formatted;
        addrSourceEl.innerText = '数据源：Photon / OpenStreetMap 道路级解析';
      } catch (error) {
        resolveWithBigDataCloud(lat, lon);
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function formatPhotonAddress(properties) {
      if (!properties) return '';
      const parts = [];
      const pushUnique = value => {
        if (containsChinese(value) && !parts.includes(value)) parts.push(value);
      };

      pushUnique(properties.country);
      pushUnique(properties.state);
      pushUnique(properties.county);
      pushUnique(properties.city);
      pushUnique(properties.locality);
      pushUnique(properties.street);
      pushUnique(properties.name);

      return parts.length >= 2 ? parts.slice(0, 7).join('，') : '';
    }

    async function resolveWithBigDataCloud(lat, lon) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 7000);

      try {
        const url = new URL('https://api-bdc.io/data/reverse-geocode-client');
        url.searchParams.set('latitude', lat.toFixed(7));
        url.searchParams.set('longitude', lon.toFixed(7));
        url.searchParams.set('localityLanguage', 'zh');

        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`BigDataCloud ${response.status}`);

        const data = await response.json();
        const formatted = formatBigDataCloudAddress(data);
        if (!formatted) throw new Error('empty address');

        addressEl.innerText = formatted;
        addrSourceEl.innerText = '数据源：BigDataCloud 行政区级解析';
      } catch (error) {
        resolveWithNominatim(lat, lon);
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function formatBigDataCloudAddress(data) {
      const parts = [];
      const pushUnique = value => {
        if (containsChinese(value) && !parts.includes(value)) parts.push(value);
      };

      pushUnique(data.countryName);
      pushUnique(data.principalSubdivision);
      pushUnique(data.city || data.locality);

      const administrative = Array.isArray(data.localityInfo && data.localityInfo.administrative)
        ? [...data.localityInfo.administrative]
        : [];
      administrative
        .filter(item => item && Number.isFinite(item.order) && item.order >= 9)
        .sort((a, b) => a.order - b.order)
        .forEach(item => pushUnique(item.name));

      return parts.length >= 2 ? parts.join('，') : '';
    }

    async function resolveWithNominatim(lat, lon) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 9000);

      try {
        const url = new URL('https://nominatim.openstreetmap.org/reverse');
        url.searchParams.set('format', 'jsonv2');
        url.searchParams.set('lat', lat.toFixed(7));
        url.searchParams.set('lon', lon.toFixed(7));
        url.searchParams.set('zoom', '18');
        url.searchParams.set('addressdetails', '1');
        url.searchParams.set('accept-language', 'zh-CN');

        const response = await fetch(url, {
          signal: controller.signal,
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error(`Nominatim ${response.status}`);

        const data = await response.json();
        const formatted = formatNominatimAddress(data);
        if (!formatted) throw new Error('empty address');

        addressEl.innerText = formatted;
        addrSourceEl.innerText = '数据源：OpenStreetMap 备用解析';
      } catch (error) {
        addressEl.innerText = '已获取坐标，地址服务暂不可用';
        addrSourceEl.innerText = '数据源：逆地理编码服务未响应';
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function formatNominatimAddress(data) {
      const address = data && data.address ? data.address : {};
      const parts = [];
      const pushUnique = value => {
        if (containsChinese(value) && !parts.includes(value)) parts.push(value);
      };

      pushUnique(address.country);
      pushUnique(address.state || address.province);
      pushUnique(address.city || address.town || address.municipality || address.county);
      pushUnique(address.city_district || address.district || address.suburb);
      pushUnique(address.road || address.pedestrian || address.neighbourhood);
      pushUnique(address.house_number);

      if (parts.length >= 2) return parts.join('，');
      if (data && data.display_name) {
        const chineseParts = data.display_name
          .split(',')
          .map(part => part.trim())
          .filter(containsChinese)
          .slice(0, 5);
        if (chineseParts.length >= 2) return chineseParts.join('，');
      }
      return '';
    }

    async function fetchWeatherData(lat, lon) {
      lastWeatherTime = Date.now();
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        const params = new URLSearchParams({
          latitude: lat.toFixed(5),
          longitude: lon.toFixed(5),
          current: 'temperature_2m,relative_humidity_2m,surface_pressure',
          daily: 'sunrise,sunset',
          timezone: 'auto'
        });

        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`, {
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`Open-Meteo ${response.status}`);

        const data = await response.json();
        if (data && data.current) {
          if (Number.isFinite(data.current.temperature_2m)) {
            document.getElementById('temperature').innerText = data.current.temperature_2m;
          }
          if (Number.isFinite(data.current.relative_humidity_2m)) {
            document.getElementById('humidity').innerText = data.current.relative_humidity_2m;
          }
          if (Number.isFinite(data.current.surface_pressure)) {
            document.getElementById('pressure').innerText = data.current.surface_pressure;
          }
        }

        if (data && data.daily && data.daily.sunrise && data.daily.sunset) {
          document.getElementById('sunrise').innerText = data.daily.sunrise[0].split('T')[1];
          document.getElementById('sunset').innerText = data.daily.sunset[0].split('T')[1];
        }

      } catch (error) {
        console.warn('气象数据请求失败:', error);
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const deltaPhi = (lat2 - lat1) * Math.PI / 180;
      const deltaLambda = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    window.addEventListener('DOMContentLoaded', prepareTracking);
  </script>
